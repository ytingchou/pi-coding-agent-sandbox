[project]
name = "pi-coding-agent-sandbox"
version = "0.1.0"
description = "Agents SDK orchestration with isolated Pi coding sessions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.135.1",
  "httpx==0.28.1",
  "openai-agents==0.22.1",
  "uvicorn==0.42.0",
]

[dependency-groups]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]
dev = [
  { include-group = "test" },
  "pre-commit>=4.2,<5",
  "ruff>=0.15,<0.16",
  "yamllint>=1.37,<2",
]
# Application libraries baked into the read-only sandbox Python, not the supervisor venv.
# sqlite3 is part of Python's standard library and must not be added here.
sandbox = ["numpy==2.2.6", "rich==14.0.0", "requests==2.32.5", "minio==7.2.20"]

[tool.uv]
package = false
required-version = ">=0.10.9,<0.11"
default-groups = ["dev"]
# cryptography 49+ removed Intel macOS support; keep Linux/arm64 unconstrained.
constraint-dependencies = ["cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-config --strict-markers"
