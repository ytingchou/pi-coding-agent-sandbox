apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pi.fullname" . }}-api
spec:
  serviceName: {{ include "pi.fullname" . }}-api
  replicas: 1
  # Do not silently evict active sessions during an image/config upgrade.
  updateStrategy: {type: OnDelete}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels:
      {{- include "pi.labels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "pi.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/values: {{ toJson .Values | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:{{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          resources:{{ toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports:
            - {name: http, containerPort: 8000}
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.existingSecret }}
                  key: {{ .Values.mongodb.uriKey }}
            - name: MONGODB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.existingSecret }}
                  key: {{ .Values.mongodb.usernameKey }}
                  optional: true
            - name: MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodb.existingSecret }}
                  key: {{ .Values.mongodb.passwordKey }}
                  optional: true
            - name: MONGODB_DATABASE
              value: {{ .Values.mongodb.database | quote }}
            - name: MONGODB_AUTH_SOURCE
              value: {{ .Values.mongodb.authSource | quote }}
            - name: MONGODB_TIMEOUT_MS
              value: {{ .Values.mongodb.timeoutMS | quote }}
            {{- if .Values.mongodb.tlsCASecret }}
            - name: MONGODB_TLS_CA_FILE
              value: /etc/mongodb-ca/ca.crt
            {{- end }}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: API_TOKEN
            - name: SANDBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SANDBOX_TOKEN
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: OPENAI_API_KEY
            - name: OPENAI_AGENTS_DISABLE_TRACING
              value: "1"
            - name: SANDBOX_ENDPOINTS
              {{- $endpoints := dict }}
              {{- $name := include "pi.fullname" . }}
              {{- range $i := until (int .Values.sandbox.replicas) }}
              {{- $id := printf "%s-workers-%d" $name $i }}
              {{- $_ := set $endpoints $id (printf "http://%s.%s-workers.%s.svc:8080" $id $name $.Release.Namespace) }}
              {{- end }}
              value: {{ toJson $endpoints | quote }}
            - name: PROMPT_TIMEOUT
              value: {{ .Values.promptTimeoutSeconds | quote }}
            - name: SESSION_CLEANUP_INTERVAL_SECONDS
              value: {{ .Values.lifecycle.cleanupIntervalSeconds | quote }}
            - name: OPENAI_MODEL
              value: {{ .Values.api.model | quote }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.api.baseUrl | quote }}
            - name: OPENAI_API_MODE
              value: {{ .Values.api.apiMode | quote }}
            - name: SESSION_IDLE_TTL_SECONDS
              value: {{ .Values.lifecycle.ephemeralIdleTtlSeconds | quote }}
          volumeMounts:
            - {name: state, mountPath: /state}
            {{- if .Values.mongodb.tlsCASecret }}
            - {name: mongodb-ca, mountPath: /etc/mongodb-ca, readOnly: true}
            {{- end }}
      {{- if .Values.mongodb.tlsCASecret }}
      volumes:
        - name: mongodb-ca
          secret:
            secretName: {{ .Values.mongodb.tlsCASecret }}
            items: [{key: ca.crt, path: ca.crt}]
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.apiSize }}
