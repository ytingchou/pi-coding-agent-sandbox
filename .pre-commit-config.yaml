repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
      - id: yamllint
        name: YAML lint
        entry: uv run --locked yamllint --strict
        language: system
        types: [yaml]
      - id: hadolint
        name: Dockerfile lint
        entry: make lint-docker
        language: system
        files: '(^|/)Dockerfile$|^\.hadolint\.yaml$'
        pass_filenames: false
