extends: default
ignore: |
  .git/
  .venv/
  .ruff_cache/
  .pytest_cache/
  artifacts/
  reports/
  **/node_modules/
rules:
  document-start: disable
  line-length:
    max: 120
    allow-non-breakable-inline-mappings: true
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false  # GitHub Actions uses the YAML key "on".
  comments:
    min-spaces-from-content: 1
